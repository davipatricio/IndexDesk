name: IndexDesk CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  roadmap:
    name: Validate roadmap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run roadmap:check

  web:
    name: Web quality and tests
    runs-on: ubuntu-latest
    needs: roadmap
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun --filter=@indexdesk/web run lint
      - run: bun --filter=@indexdesk/web run typecheck
      - run: bun --filter=@indexdesk/web run test
      - run: bun --filter=@indexdesk/web run build

  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    needs: roadmap
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: dotnet tool restore
      - run: dotnet restore apps/backend/IndexDesk.sln
      - run: dotnet build apps/backend/IndexDesk.sln -c Release --no-restore
      - working-directory: apps/backend
        run: dotnet format style IndexDesk.sln --verify-no-changes
      - working-directory: apps/backend
        run: dotnet format analyzers IndexDesk.sln --verify-no-changes --severity error
      - run: dotnet test apps/backend/IndexDesk.sln -c Release --no-build --logger "console;verbosity=normal"
